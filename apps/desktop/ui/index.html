<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scenecast</title>
  <link rel="preload" href="fonts/Barlow-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Barlow-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <nav class="rail" aria-label="Scenecast">
      <button id="nav-library" class="brand" data-test="nav-library" aria-label="Scenecast: all your demos">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.5 8h10M8.5 3.5 13 8l-4.5 4.5"/></svg></span>
        <span>Scenecast</span>
      </button>
      <button id="new-demo" class="railbtn" data-test="new-demo">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New demo
      </button>
      <h2 class="nav-heading" id="demos-heading">Your demos</h2>
      <ul id="demo-list" class="demo-list" aria-labelledby="demos-heading"></ul>
      <div class="sidebar-foot">
        <div id="update" class="update" hidden data-test="update-banner"></div>
        <button id="nav-copilot" class="rail-copilot" data-test="nav-copilot">
          <span class="dot" aria-hidden="true"></span><span id="copilot-state" data-test="copilot-state">Copilot</span>
        </button>
        <div class="rail-meta">
          <span><button id="help" class="link" data-test="help">Help</button> · <span id="version"></span></span>
          <button id="check-updates" class="link" data-test="check-updates">Check for updates</button>
        </div>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
