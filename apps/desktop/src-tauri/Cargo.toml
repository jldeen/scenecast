[package]
name = "scenecast-desktop"
description = "Scenecast's desktop app (Tauri, macOS and Windows) on the scenecast-app library"
version = "0.4.5"
edition = "2024"
license = "MIT"
repository = "https://github.com/jldeen/scenecast"
default-run = "scenecast-desktop"

# Its own workspace: it needs a webview toolkit to build, which the rest of the repo doesn't.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
scenecast-app = { path = "../../../crates/scenecast-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-app updates: signed builds from the GitHub release's latest.json.
tauri-plugin-updater = "2"
trash = "5"
# The embedded WebDriver server the UI test drives the app through (macOS, Windows, Linux). Never in an installer.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
# Local testing only (scripts/auditaur-smoke.mjs): Auditaur's collector, so its CLI sees the app's commands, events,
# logs and errors. Never in an installer.
tauri-plugin-auditaur = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
auditaur = ["dep:tauri-plugin-auditaur", "dep:tracing", "dep:tracing-subscriber"]

# Debug builds (the UI test's) without debug info: the webview stack's makes them gigabytes, on disk and in CI caches.
[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = 0

[profile.release]
codegen-units = 1
lto = true
strip = true
