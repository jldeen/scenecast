[workspace]
members = [
    "crates/scenecast-app",
    "crates/scenecast-build",
    "crates/scenecast-cli",
    "crates/scenecast-core",
]
# The desktop app's Tauri shell is its own workspace (it needs a webview toolkit to build).
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jldeen/scenecast"
version = "0.4.6"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
clap = "4.5.53"
predicates = "3.1.3"
scenecast-build = { path = "crates/scenecast-build" }
scenecast-core = { path = "crates/scenecast-core" }
serde = "1.0.228"
schemars = "1.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
