[workspace]
members = [
    "crates/scenecast-app",
    "crates/stuntdouble-build",
    "crates/stuntdouble-cli",
    "crates/stuntdouble-format",
]
# The desktop app's Tauri shell is its own workspace (it needs a webview toolkit to build).
exclude = ["apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/jldeen/scenecast"
version = "0.5.6-rc.4"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.1.1"
clap = "4.5.53"
predicates = "3.1.3"
# The engine is StuntDouble's. Scenecast's own crate (scenecast-app) keeps its old names for it.
scenecast-build = { package = "stuntdouble-build", path = "crates/stuntdouble-build" }
scenecast-core = { package = "stuntdouble-format", path = "crates/stuntdouble-format" }
stuntdouble-build = { path = "crates/stuntdouble-build" }
stuntdouble-format = { path = "crates/stuntdouble-format" }
serde = "1.0.228"
schemars = "1.0"
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
