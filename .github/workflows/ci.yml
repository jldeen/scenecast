name: CI

on:
  pull_request:
  push:
    branches:
      - main
    # A version tag (v0.3.0) runs everything, then the release job publishes the installers.
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The repo is public: every committed lockfile installs from the public registry, never an internal feed.
      - name: Lockfiles point at the public registry only
        if: runner.os == 'Linux'
        run: |
          files=$(git ls-files '*package-lock.json' '*npm-shrinkwrap.json' '*yarn.lock' '*pnpm-lock.yaml' '*uv.lock')
          internal=$(echo "$files" | xargs -r grep -nE 'pkgs\.visualstudio\.com|pkgs\.dev\.azure\.com|packagefeedproxy|artifactory|nexus' || true)
          offpublic=$(echo "$files" | xargs -r grep -nE '("resolved"|resolved|tarball)[": =]+"?https?://' \
            | grep -vE 'https://(registry\.npmjs\.org|registry\.yarnpkg\.com|pypi\.org|files\.pythonhosted\.org|codeload\.github\.com|github\.com)/' || true)
          if [ -n "$internal$offpublic" ]; then echo "Committed lockfiles must install from the public registry:"; printf '%s\n%s\n' "$internal" "$offpublic" | head -40; exit 1; fi
      # Pre-release ("daily") ring hosts stay in private app packs, out of this public repository.
      - name: No pre-release ring hosts
        if: runner.os == 'Linux'
        run: |
          hits=$(git grep -nIE 'daily\.[a-z0-9-]+\.(microsoft\.com|office\.com|cloud\.microsoft)' -- . ':!.github/workflows/ci.yml' || true)
          if [ -n "$hits" ]; then echo "Pre-release ring hosts in the repository:"; echo "$hits" | head -20; exit 1; fi
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Test
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  binaries:
    # The stuntdouble binary for each OS and CPU, as @stuntdouble/build-<os>-<cpu> ships it: a demo outside this
    # repository vendors one with scripts/stuntdouble-pack.mjs --binary <file> --platform <os-cpu>.
    name: Binary (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin-arm64, target: aarch64-apple-darwin, exe: stuntdouble }
          - { os: macos-latest, platform: darwin-x64, target: x86_64-apple-darwin, exe: stuntdouble }
          - { os: windows-latest, platform: win32-x64, target: x86_64-pc-windows-msvc, exe: stuntdouble.exe }
          - { os: windows-latest, platform: win32-arm64, target: aarch64-pc-windows-msvc, exe: stuntdouble.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: binary-${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p stuntdouble-cli --target ${{ matrix.target }}
      - name: Runs (the runner's own CPU)
        if: matrix.platform == 'darwin-arm64' || matrix.platform == 'win32-x64'
        run: target/${{ matrix.target }}/release/${{ matrix.exe }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: stuntdouble-${{ matrix.platform }}
          path: target/${{ matrix.target }}/release/${{ matrix.exe }}
          if-no-files-found: error

  engine:
    # The JS engine end to end, headless, through the scenecast binary: the fixture app recorded by the extension, built, served,
    # and checked (two runs, three cold starts, focus points, the whole checklist), with only live-page scenes.
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # The recorder extension is tested in Playwright's Chromium (it takes --load-extension); branded Chrome and Edge
      # (on the runners already) get it through the DevTools protocol.
      - name: Chromium for the extension tests
        run: npx playwright-core install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      # Google Chrome comes with the GitHub runners (Playwright's "chrome" channel uses it).
      - name: Build the scenecast binary
        run: cargo build -p stuntdouble-cli
      - name: Git identity for the test demo's commits
        run: |
          git config --global user.name "scenecast ci"
          git config --global user.email "ci@localhost"
      - name: Engine tests (unit, capture, selftest)
        run: npm test
        env:
          SCENECAST_BIN: ${{ runner.os == 'Windows' && 'target/debug/scenecast.exe' || 'target/debug/scenecast' }}

  desktop-ui:
    # The desktop app end to end, in its real window through its embedded WebDriver server: a scripted new user creates
    # a demo of the fixture app, records it (Chromium with the recorder extension, headless), builds and checks it, runs
    # fidelity and the script, adds a dot and changes a date in the editor, presents and exports. No terminal.
    name: Desktop app UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Install
        run: |
          npm ci
          npm ci --prefix apps/desktop
      - name: Chromium for the presenter's browser (the recorder extension, loaded unpacked)
        run: npx playwright-core install chromium
      - name: Build the app (with the test WebDriver server)
        working-directory: apps/desktop
        run: npm run build:test
      - name: Lint the app
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --features webdriver -- -D warnings
      - name: UI test
        working-directory: apps/desktop
        run: npm run test:ui
        env:
          SCENECAST_UI_SHOTS: ${{ github.workspace }}/ui-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens-${{ runner.os }}
          path: ui-shots/
          if-no-files-found: ignore

  installers:
    # A universal macOS .dmg and a Windows .msi and NSIS installer, with the engine and Node inside. Signed when the
    # signing secrets are set (docs/app/signing.md); unsigned (ad-hoc on the Mac) when they aren't.
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - os: windows-latest
            targets: ''
            args: --bundles msi,nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: installers
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/desktop
      - name: Signing secrets, when there are any
        shell: bash
        env:
          S_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          S_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          S_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          S_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          S_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="$(printenv "S_$name" || true)"
            if [ -n "$value" ]; then
              { echo "$name<<SCENECAST_EOF"; echo "$value"; echo "SCENECAST_EOF"; } >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done
      - name: Node and signing for the installer
        working-directory: apps/desktop
        run: node scripts/prepare-bundle.mjs
      - name: Build the installers
        working-directory: apps/desktop
        run: npx tauri build ${{ matrix.args }} --config src-tauri/tauri.bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: scenecast-${{ runner.os }}-installers
          # With the updater's key: the signed update files too (.app.tar.gz on the Mac) and each one's .sig.
          path: |
            apps/desktop/src-tauri/target/**/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/**/bundle/msi/*.msi
            apps/desktop/src-tauri/target/**/bundle/msi/*.msi.sig
            apps/desktop/src-tauri/target/**/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/**/bundle/nsis/*.exe.sig
            apps/desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  packaged:
    # The installers from the job above, installed the way a presenter installs them and started with nothing else:
    # the receiver starts with the app's own Node, the extension (in Documents/Scenecast/Recorder Extension) connects
    # in Google Chrome on a non-Default profile, preflight says so, Fix and Install recorder work in the running Chrome.
    name: Installed app (${{ matrix.os }})
    needs: installers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install (the test's own tools; the app brings its own Node and engine)
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: scenecast-${{ runner.os }}-installers
          path: dist
      - name: Test the installed app
        shell: bash
        run: |
          inst="$(find dist -name '*.dmg' -o -name '*-setup.exe' | head -1)"
          echo "installer: $inst"
          node apps/desktop/tests/packaged.test.mjs "$inst"

  update:
    # The in-app update as presenters get it: the published release before this one (v0.5.2, from its release),
    # updated to this build through its Update (the app's test hook), signed with the real updater key. Its feed is a
    # throwaway pre-release (the release's updater only reads https), deleted afterwards. The relaunched app must find
    # its engine, read Copilot's state, carry none of the old version's variables, and drop the test feed when opened
    # normally. Without the updater key (a fork's pull request): two builds of this code, a throwaway key, a local feed.
    name: In-app update (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      FROM: v0.5.2
      S_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      S_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      FEED_RELEASE: ci-update-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: update-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/desktop
      - name: Update (apps/desktop/scripts/update-ci.sh)
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: apps/desktop/scripts/update-ci.sh

  release:
    # On a version tag, once every job is green: a GitHub Release with the macOS and Windows installers and the printable
    # guide attached, its notes from docs/releases/<tag>.md. The installers are unsigned until the signing secrets are
    # set (docs/app/signing.md); docs/guide.md explains the one-time "open anyway" on each system.
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, engine, desktop-ui, installers, packaged, update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the app's version
        shell: bash
        run: |
          want="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          [ "${GITHUB_REF_NAME#v}" = "$want" ] || { echo "tag $GITHUB_REF_NAME, but the app is $want"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: scenecast-*-installers
          path: dist
          merge-multiple: true
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The update files get the version in their name (the Mac's is Scenecast.app.tar.gz as built).
          for f in $(find dist -name 'Scenecast.app.tar.gz'); do mv "$f" "$(dirname "$f")/Scenecast_${TAG#v}_universal.app.tar.gz"; mv "$f.sig" "$(dirname "$f")/Scenecast_${TAG#v}_universal.app.tar.gz.sig"; done
          mapfile -t files < <(find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) | sort)
          # The in-app updater's feed: when the installers were signed with the updater's key (the
          # TAURI_SIGNING_PRIVATE_KEY secret). Without it the release has no latest.json, and apps keep their version.
          if find dist -name '*.sig' | grep -q .; then
            node apps/desktop/scripts/latest-json.mjs dist "${TAG#v}" "https://github.com/${{ github.repository }}/releases/download/$TAG/" "docs/releases/$TAG.md"
            mapfile -t -O "${#files[@]}" files < <(find dist -type f \( -name '*.sig' -o -name '*.app.tar.gz' -o -name 'latest.json' \) | sort)
          else
            echo "::warning::no updater signatures (TAURI_SIGNING_PRIVATE_KEY isn't set): no latest.json in this release"
          fi
          printf '%s\n' "${files[@]}"
          find dist -name '*.dmg' | grep -q . || { echo "no macOS installer"; exit 1; }
          find dist -name '*.msi' | grep -q . || { echo "no Windows installer"; exit 1; }
          # The same installers under names that don't change, so one link always gets the newest
          # (releases/latest/download/Scenecast-mac.dmg; docs/download/index.html).
          mkdir -p stable
          cp "$(find dist -name '*.dmg' | head -1)" stable/Scenecast-mac.dmg
          setup="$(find dist -name '*-setup.exe' | head -1)"
          [ -n "$setup" ] && cp "$setup" stable/Scenecast-windows-setup.exe
          files+=(stable/*)
          files+=(docs/guide.pdf)
          notes="docs/releases/$TAG.md"
          # A release candidate (a tag with a pre-release part, v0.5.0-rc.1) is a pre-release: never "latest", so
          # installed apps and the releases/latest/download links don't see it. A version tag (v0.5.0) is as before.
          pre=()
          [[ "${TAG#v}" == *-* ]] && pre=(--prerelease --latest=false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          elif [ -f "$notes" ]; then
            gh release create "$TAG" "${files[@]}" --title "Scenecast ${TAG#v}" --notes-file "$notes" --verify-tag "${pre[@]}"
          else
            gh release create "$TAG" "${files[@]}" --title "Scenecast ${TAG#v}" --generate-notes --verify-tag "${pre[@]}"
          fi
